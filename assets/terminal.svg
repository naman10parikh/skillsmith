<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">skillsmith --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: skillsmith [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">Create, test and vet SKILL.md skills for any coding agent.</text>
<text x="24" y="146" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">  -V, --version                    output the version number</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  -h, --help                       display help for command</text>
<text x="24" y="226" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">  init [options] [name]            Scaffold a new Claude Code skill with best</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">                                   practices</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">  test [options] [path]            Validate a skill against the Claude Code</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">                                   skill spec</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">  publish [options] [path]         Validate a skill for sharing (the shared</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">                                   registry is not live yet)</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">  install [options] &lt;name&gt;         Install a starter skill from the built-in</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">                                   catalog into your project</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">  list [options]                   Browse the built-in skill catalog</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">  memory-search [options] &lt;query&gt;  BM25 search over skillsmith's own knowledge</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">                                   corpus (brain/, memory/, identity/, docs)</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">  sandbox-run [options] [path]     Validate an untrusted skill inside an</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">                                   isolated E2B sandbox (Firecracker microVM)</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">  mcp                              Start the skillsmith MCP server (JSON-RPC 2.0</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">                                   over stdio)</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">  help [command]                   display help for command</text>
</svg>
